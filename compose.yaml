services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: procurement_pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d procurement_pilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pilot_pgdata:
