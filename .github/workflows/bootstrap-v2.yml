name: Import prepared project

on:
  push:
    paths:
      - bootstrap.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract prepared files and remove import assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path.cwd()
          with ZipFile(root / 'bootstrap.zip') as archive:
              for item in archive.infolist():
                  if not item.filename.startswith('.github/workflows/'):
                      archive.extract(item, root)
          (root / 'bootstrap.zip').unlink()
          PY
      - name: Commit imported project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete project structure'
          git push
