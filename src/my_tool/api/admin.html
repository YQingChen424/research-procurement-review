<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科研采购管理后台</title><style>body{font:15px 'Microsoft YaHei',sans-serif;background:#eff5f3;color:#163a38;margin:0}main{max-width:1000px;margin:30px auto;padding:0 20px}section{background:white;border:1px solid #dceae6;border-radius:14px;padding:20px;margin:16px 0}input,textarea,button{padding:10px;border:1px solid #bbd0cb;border-radius:8px;font:inherit}textarea{width:100%;min-height:100px;box-sizing:border-box}button{background:#176d61;color:white;cursor:pointer}label{display:inline-block;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f7f5;padding:12px;border-radius:8px}small{color:#54726a}</style></head><body><main><h1>科研采购管理后台</h1><p>本页面用于模拟制度管理与授权审计。</p><section><h2>管理员登录</h2><input id="name" placeholder="用户名"><input id="pass" type="password" placeholder="密码"><button id="login">登录</button> <small id="loginStatus"></small></section><section><h2>制度文档</h2><form id="upload"><input name="title" placeholder="制度名称" required><input name="version" placeholder="版本" required><input name="file" type="file" accept=".md,.pdf" required><button>上传并索引</button></form><p><button id="docs">查看制度</button></p><pre id="docsOut"></pre></section><section><h2>问答提示词</h2><textarea id="prompt">你是科研采购制度助手，只根据提供的制度条文回答，不确定时明确说“制度中未找到”，回答附引用来源，不得编造采购或安全要求。</textarea><button id="savePrompt">发布新版本</button><button id="showPrompt">查看历史</button><pre id="promptOut"></pre></section><section><h2>对话审计</h2><label>用户 ID <input id="uid" type="number"></label><label>开始时间 <input id="since" type="datetime-local"></label><label>结束时间 <input id="until" type="datetime-local"></label><button id="audit">查询</button><pre id="auditOut"></pre><p><input id="msgid" type="number" placeholder="消息 ID"><input id="reason" placeholder="人工复核标记原因"><button id="flag">标记待复核</button></p><small>关键词仅用于提示人工复核，不代表违规结论。</small></section></main><script>
let token='';const el=id=>document.getElementById(id);async function request(path,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token};let r=await fetch(path,opts),data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail?.message||data.detail||'请求失败');return data}function show(id,obj){el(id).textContent=typeof obj==='string'?obj:JSON.stringify(obj,null,2)}async function run(id,fn){try{show(id,await fn())}catch(e){show(id,e.message)}}
el('login').onclick=async()=>{try{let r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:el('name').value,password:el('pass').value})});let d=await r.json();if(!r.ok)throw new Error(d.detail?.message||'登录失败');if(d.role!=='admin')throw new Error('该账号不是管理员');token=d.access_token;el('pass').value='';show('loginStatus','已登录，令牌有效期 30 分钟')}catch(e){show('loginStatus',e.message)}};
el('upload').onsubmit=e=>{e.preventDefault();run('docsOut',()=>request('/admin/documents',{method:'POST',body:new FormData(e.target)}))};el('docs').onclick=()=>run('docsOut',()=>request('/documents'));
el('savePrompt').onclick=()=>run('promptOut',()=>request('/admin/prompts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:el('prompt').value})}));el('showPrompt').onclick=()=>run('promptOut',()=>request('/admin/prompts'));
el('audit').onclick=()=>{let params=new URLSearchParams();for(let [name,id] of [['user_id','uid'],['since','since'],['until','until']])if(el(id).value)params.set(name,el(id).value);run('auditOut',()=>request('/admin/audit/conversations?'+params))};el('flag').onclick=()=>run('auditOut',()=>request('/admin/audit/messages/'+encodeURIComponent(el('msgid').value)+'/flags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:el('reason').value})}));
</script></body></html>
