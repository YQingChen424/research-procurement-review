<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科研采购核查助手</title><style>body{font:15px 'Microsoft YaHei',sans-serif;color:#193d3a;background:#eff5f3;margin:0}main{max-width:900px;margin:30px auto;padding:0 20px}section{background:#fff;border:1px solid #dceae6;border-radius:16px;padding:22px;margin:18px 0}input,select,button{padding:10px;border:1px solid #bbd0cb;border-radius:8px;font:inherit}input{width:70%}button{background:#176d61;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;background:#f2f7f5;padding:15px;border-radius:10px}a{color:#176d61}</style></head><body><main><h1>科研采购核查助手</h1><p>查看制度、检查申请，或准备一条需要人工确认的交接。</p><a href="/chat-ui">返回制度问答</a><section><h2>演示令牌</h2><input type="password" id="token" placeholder="输入申请人或审核人令牌"><button id="load">加载可用申请</button><p id="info"></p></section><section><h2>发起核查</h2><label>问题 <input id="question" value="核查并准备交接"></label><label>申请 <select id="request"><option value="">仅查询制度</option></select></label><label>接收人 <select id="receiver"><option value="">不准备交接</option></select></label><button id="run">开始核查</button><p id="status"></p><pre id="output">执行过程会显示在这里。</pre><button id="confirm" disabled>确认创建待接收交接</button><p>创建交接后，仍需指定接收人另行确认；申请中的凭证声明须由授权人员核实。</p></section><section><h2>接收人确认交接</h2><p>请使用指定接收人的令牌和上一步生成的交接 ID。</p><label>接收人令牌 <input type="password" id="receiveToken" placeholder="输入接收人令牌"></label><label>交接 ID <input type="number" id="handoffId" placeholder="输入交接 ID"></label><button id="receive">确认接收</button><p id="receiveStatus"></p></section></main><script>
const el=id=>document.getElementById(id);let draft=null,token=sessionStorage.getItem('pilot_token')||'';el('token').value=token;
async function api(path,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token};let response=await fetch(path,opts);if(!response.ok){let x=await response.json().catch(()=>({}));throw Error(x.detail?.message||x.detail||'请求失败')}return response}
el('load').onclick=async()=>{token=el('token').value.trim();sessionStorage.setItem('pilot_token',token);try{let requests=await(await api('/requests')).json(),users=await(await api('/users')).json();el('request').replaceChildren(new Option('仅查询制度',''));requests.forEach(r=>el('request').add(new Option(r.business_id,r.id)));el('receiver').replaceChildren(new Option('不准备交接',''));users.forEach(u=>el('receiver').add(new Option(u.username+'（'+u.role+'）',u.id)));el('info').textContent='已加载 '+requests.length+' 条申请与 '+users.length+' 位用户。'}catch(e){el('info').textContent=e.message}};
el('run').onclick=async()=>{draft=null;el('confirm').disabled=true;el('output').textContent='';el('status').textContent='正在核查…';el('run').disabled=true;try{let data={question:el('question').value.trim()};if(el('request').value){let request=await(await api('/requests/'+el('request').value)).json();data.version_id=request.versions[request.versions.length-1].id}if(el('receiver').value)data.receiver_id=Number(el('receiver').value);let response=await api('/agent/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),reader=response.body.getReader(),decoder=new TextDecoder(),buffer='';while(true){let part=await reader.read();if(part.done)break;buffer+=decoder.decode(part.value,{stream:true}).replace(/\r\n/g,'\n');let n;while((n=buffer.indexOf('\n\n'))>=0){let block=buffer.slice(0,n);buffer=buffer.slice(n+2);let kind=block.match(/^event: (.+)$/m)?.[1],raw=block.match(/^data: (.+)$/m)?.[1];if(!raw)continue;let obj=JSON.parse(raw);if(kind==='tool'){el('output').textContent+='\n工具：'+obj.tool+'\n'+JSON.stringify(obj.result,null,2)+'\n'}else if(kind==='confirmation_required'){draft=obj.draft_id;el('confirm').disabled=false;el('status').textContent='请核对草稿后确认。'}else if(kind==='done'){el('status').textContent=obj.message||'核查结束。'}else if(kind==='error'){el('status').textContent=obj.message}}}}catch(e){el('status').textContent=e.message}finally{el('run').disabled=false}};
el('confirm').onclick=async()=>{if(draft===null)return;el('confirm').disabled=true;try{let result=await(await api('/agent/drafts/'+draft+'/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:true})})).json();el('output').textContent+='\n已创建待接收交接：'+JSON.stringify(result,null,2);el('status').textContent='等待指定接收人确认。';draft=null}catch(e){el('status').textContent=e.message;el('confirm').disabled=false}};
el('receive').onclick=async()=>{try{let id=el('handoffId').value,credential=el('receiveToken').value.trim();if(!id||!credential)throw Error('请输入交接 ID 和接收人令牌');let response=await fetch('/handoffs/'+encodeURIComponent(id)+'/confirm',{method:'POST',headers:{Authorization:'Bearer '+credential}}),data=await response.json();if(!response.ok)throw Error(data.detail?.message||data.detail||'确认失败');el('receiveStatus').textContent='接收人已确认交接。';el('receiveToken').value=''}catch(e){el('receiveStatus').textContent=e.message}};
</script></body></html>
